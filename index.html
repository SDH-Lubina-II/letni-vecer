<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fire Sport Results</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:white;
    background:
        radial-gradient(circle at top right,#5b1010 0%,transparent 35%),
        linear-gradient(145deg,#090d13,#151b24);
}

.app{
    max-width:650px;
    margin:auto;
    padding:25px 18px 40px;
}

header{
    text-align:center;
    padding:25px 10px 35px;
}

.logo{
    width:78px;
    height:78px;
    margin:auto;
    border-radius:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    background:linear-gradient(145deg,#ffb000,#e43b00);
    box-shadow:0 12px 35px rgba(255,90,0,.30);
}

h1{
    margin:18px 0 8px;
    font-size:27px;
    letter-spacing:1px;
}

.subtitle{
    color:#b8c1ce;
    font-size:14px;
    line-height:1.5;
}

.section-title{
    margin:0 0 12px;
    color:#8796aa;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:2px;
}

.soutez{
    width:100%;
    border:1px solid rgba(255,255,255,.10);
    border-radius:24px;
    padding:25px 20px;
    margin-bottom:16px;
    color:white;
    text-align:left;
    cursor:pointer;
    transition:.2s;
    background:rgba(255,255,255,.055);
}

.soutez:hover{
    transform:translateY(-2px);
    background:rgba(255,255,255,.09);
}

.soutez:active{
    transform:scale(.98);
}

.icon{
    font-size:48px;
    margin-bottom:12px;
}

.nazev{
    font-size:22px;
    font-weight:bold;
    margin-bottom:7px;
}

.popis{
    color:#9eabba;
    font-size:14px;
}

footer{
    text-align:center;
    color:#596575;
    font-size:12px;
    margin-top:30px;
}
</style>
</head>

<body>

<div class="app">

<header>

    <div class="logo">🚒</div>

    <h1>SBOR DOBROVOLNÝCH HASIČŮ<br>
    LUBINA II–VĚTŘKOVICE</h1>

    <div class="subtitle">
        okres Nový Jičín
    </div>

</header>

<div class="section-title">
    Soutěže
</div>

<button class="soutez" onclick="otevriPozarniUtok()">

    <div class="icon">🚒</div>

    <div class="nazev">
        Požární útok
    </div>

    <div class="popis">
        Aktuální pořadí
    </div>

</button>

<button class="soutez" onclick="otevriMotani()">

    <div class="icon">🌀</div>

    <div class="nazev">
        Motání hadic
    </div>

    <div class="popis">
        Jednotlivci · nejrychlejší čas
    </div>

</button>

<footer>
    Fire Sport Results
</footer>

</div>

<script>

function otevriPozarniUtok(){
    alert("Požární útok – připravujeme");
}

function otevriMotani(){
    alert("Motání hadic – připravujeme");
}

</script>

</body>
</html>
